# Design 18, 21.7: tools/vendor/verify on every push, and on pull requests a
# change under the vendor tree must also change the manifest and checksums.
on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "12 0 * * 0"
  workflow_dispatch:
  pull_request:

name: vendor

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  vendor:
    uses: pedrobtz/r-actions/.github/workflows/vendor.yml@59c917ddee2cd0191f8f015016c4c76c4f2a8c87 # v1
    with:
      vendor-dir: inst/include/zufast/vendor
