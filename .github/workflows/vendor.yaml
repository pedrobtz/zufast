# Design 18, 21.7: the vendor tree matches tools/vendor/checksums.sha256,
# reverse-applying the patches gives back the pinned upstream files, every
# patch is named in the manifest, inst/COPYRIGHTS and cran-comments.md, and
# the defines in detail/vendor_config.h match the manifest. Offline.
on:
  push:
    branches: [main, master]
  pull_request:

name: vendor

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify vendored sources
        run: tools/vendor/verify
