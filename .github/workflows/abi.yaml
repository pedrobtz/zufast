# Design 21.1: the installed headers compile standalone as C99 and C++11,
# a unit that includes everything and uses nothing is warning-free, and a
# unit that calls every public function is warning-free, with GCC and clang.
on:
  push:
    branches: [main, master]
  pull_request:

name: abi

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  headers:
    name: headers (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc, cxx: g++ }
          - { os: ubuntu-latest, cc: clang, cxx: clang++ }
          - { os: macos-latest, cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v6
      - name: Header gate
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          $CC --version
          tools/check-headers
