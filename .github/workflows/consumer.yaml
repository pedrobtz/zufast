# Design 21.6: tools/zufasttest is a package in the shape every consumer has
# (LinkingTo: zufast, no Imports, nothing in NAMESPACE but useDynLib, two
# translation units including <zufast.h>). Install zufast, then the fixture;
# check the fixture with no compiled-code NOTE; run its tests; assert its
# shared object defines no global zuf_ or vendor symbol; then uninstall
# zufast and prove the fixture still loads and passes.
on:
  push:
    branches: [main, master]
  pull_request:

name: consumer

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fixture:
    runs-on: ${{ matrix.os }}
    name: fixture (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      _R_CHECK_CRAN_INCOMING_: false
      _R_CHECK_SYSTEM_CLOCK_: false
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::testthat

      - name: Install zufast, then the fixture
        shell: bash
        run: |
          R CMD INSTALL .
          R CMD INSTALL tools/zufasttest

      - name: R CMD check the fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fixture" && cd "$RUNNER_TEMP/fixture"
          R CMD build "$GITHUB_WORKSPACE/tools/zufasttest"
          R CMD check --as-cran --no-manual zufasttest_*.tar.gz || true
          log=zufasttest.Rcheck/00check.log
          cat "$log"
          grep -q 'checking compiled code ... OK' "$log" || { echo "::error::compiled-code check not OK"; exit 1; }
          if grep -qE '^Status: .*(ERROR|WARNING)' "$log"; then echo "::error::fixture check failed"; exit 1; fi

      - name: Run the fixture's tests
        shell: bash
        working-directory: tools/zufasttest/tests
        run: Rscript testthat.R

      - name: No global zuf_ or vendor symbol in the fixture
        if: runner.os != 'Windows'
        shell: bash
        run: |
          so=$(Rscript -e 'cat(system.file("libs", package = "zufasttest"))')/zufasttest.so
          if [ "$RUNNER_OS" = macOS ]; then syms=$(nm -gU "$so" | awk '{print $NF}' | sed 's/^_//'); else syms=$(nm -D --defined-only "$so" | awk '{print $NF}'); fi
          echo "$syms"
          bad=$(echo "$syms" | grep -E '^(zuf_|ZUF_|ffc_|FFC_|XXH|zuf_int_ryu|d2s|f2s)' || true)
          [ -z "$bad" ] || { echo "::error::global symbols: $bad"; exit 1; }
          echo "$syms" | grep -qx R_init_zufasttest

      - name: Uninstall zufast; the fixture still loads and passes
        shell: bash
        working-directory: tools/zufasttest/tests
        run: |
          Rscript -e 'remove.packages("zufast", lib = dirname(find.package("zufast")))'
          Rscript -e 'stopifnot(!requireNamespace("zufast", quietly = TRUE)); library(zufasttest)'
          Rscript testthat.R
